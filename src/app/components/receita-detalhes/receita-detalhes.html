<section [id]="'detalhes-' + receita().id">
  <h3>Preparo: {{ receita().nome }}</h3>
  <h4>Ingredientes</h4>
  <ul>
    @for (ingrediente of receita().ingredientes; track $index) {
      <li>{{ ingrediente }}</li>
    }
  </ul>

  <h4>Modo de preparo</h4>
  <ol>
    @for (passo of receita().preparo; track $index) {
      <li>{{ passo }}</li>
    }
  </ol>
  <p><strong>Dica:</strong> {{ receita().dica }}</p>
</section>
